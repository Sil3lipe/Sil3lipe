<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160c31" />
      <stop offset="100%" stop-color="#0b061e" />
    </radialGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <rect width="100" height="2" fill="#000000" fill-opacity="0.35" />
    </pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#442a78" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-line-cyan {
        stroke-dasharray: 18 160;
        animation: flowCyan 3s linear infinite;
      }
      .pulse-line-gold {
        stroke-dasharray: 18 160;
        animation: flowGold 2.6s linear infinite;
      }
      @keyframes flowCyan {
        from { stroke-dashoffset: 356; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowGold {
        from { stroke-dashoffset: 356; }
        to { stroke-dashoffset: 0; }
      }
      .neon-text {
        animation: neonPulse 2.5s ease-in-out infinite alternate;
      }
      @keyframes neonPulse {
        0% { opacity: 0.82; }
        100% { opacity: 1; }
      }
      .float-box {
        animation: floatAnim 3s ease-in-out infinite alternate;
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#grid)" />

  <g font-family="monospace" font-size="14" fill="#b0a8c0" opacity="0.45">
    <text x="195" y="45">{ }</text>
    <text x="35" y="140" fill="#ffcc00">
      [ ]
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </text>
    <text x="480" y="65">function { ... }</text>
    <text x="460" y="105">}</text>
    <text x="860" y="32">function {</text>
    <text x="880" y="48">--- {...};</text>
    <text x="880" y="64">function (...);</text>
    <text x="860" y="80">}</text>
    <text x="560" y="230">{ ;</text>
    <text x="1080" y="220">{ }</text>
    <text x="100" y="255">{</text>
    <text x="155" y="282" fill="#00ffcc">const <tspan fill="#f0f0f0">database =</tspan> <tspan fill="#ff007f">mysql;</tspan></text>
    <text x="135" y="302">}</text>
  </g>

  <g stroke="#442a78" stroke-width="2" class="float-box">
    <rect x="65" y="65" width="24" height="24" fill="#26164f" />
    <rect x="92" y="65" width="50" height="24" fill="#00ffcc" fill-opacity="0.25">
      <animate attributeName="fill-opacity" values="0.15;0.65;0.15" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="145" y="65" width="24" height="24" fill="#26164f" />
    <rect x="80" y="95" width="24" height="24" fill="#ff007f" fill-opacity="0.3">
      <animate attributeName="fill-opacity" values="0.2;0.75;0.2" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="685" y="255" width="16" height="16" fill="#00ffcc" fill-opacity="0.6">
      <animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="706" y="255" width="16" height="16" fill="#26164f" />
    <rect x="727" y="255" width="16" height="16" fill="#442a78" />
    <rect x="748" y="255" width="16" height="16" fill="#ffcc00" fill-opacity="0.8">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Base Static Circuit Wires (Cyan) -->
  <g fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M 0 185 L 45 185 L 70 210 L 120 210" />
    <path d="M 0 205 L 35 205 L 65 235 L 105 235" />
    <path d="M 155 180 L 220 242 L 405 200 L 495 130 L 545 130" />
    <path d="M 675 95 L 675 28" />
    <path d="M 675 95 L 635 52" />
    <path d="M 675 95 L 715 52" />
    <path d="M 720 120 L 765 88 L 795 88" />
    <path d="M 730 140 L 775 112 L 805 112" />
    <path d="M 810 130 L 810 245" />
    <path d="M 670 215 L 605 215 L 555 265 L 420 265" />
    <path d="M 685 230 L 620 230 L 570 280 L 440 280" />
    <path d="M 700 245 L 635 245 L 585 295 L 460 295" />
  </g>

  <!-- Animated Energy Pulses (Cyan) -->
  <g fill="none" stroke="#00ffcc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="pulse-line-cyan">
    <path d="M 155 180 L 220 242 L 405 200 L 495 130 L 545 130" />
    <path d="M 810 130 L 810 245" />
    <path d="M 670 215 L 605 215 L 555 265 L 420 265" />
    <path d="M 685 230 L 620 230 L 570 280 L 440 280" />
  </g>

  <!-- Base Static Circuit Wires (Gold) -->
  <g fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M 810 175 L 870 175 L 895 152 L 945 152 L 990 195 L 1060 195" />
    <path d="M 865 205 L 930 205 L 1005 130 L 1095 130" />
    <path d="M 1020 165 L 1075 110 L 1140 110" />
    <path d="M 1045 180 L 1110 115 L 1200 115" />
    <path d="M 810 245 L 940 245 L 995 290 L 1085 290" />
    <path d="M 1110 190 L 1155 145 L 1200 145" />
  </g>

  <!-- Animated Energy Pulses (Gold) -->
  <g fill="none" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="pulse-line-gold">
    <path d="M 810 175 L 870 175 L 895 152 L 945 152 L 990 195 L 1060 195" />
    <path d="M 865 205 L 930 205 L 1005 130 L 1095 130" />
    <path d="M 810 245 L 940 245 L 995 290 L 1085 290" />
  </g>

  <!-- Glowing & Pulsing Circuit Nodes -->
  <g filter="url(#glow)">
    <circle cx="155" cy="180" r="6" fill="#00ffcc">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="220" cy="242" r="6" fill="#00ffcc" />
    <circle cx="405" cy="200" r="6" fill="#00ffcc">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="545" cy="130" r="6" fill="#00ffcc">
      <animate attributeName="r" values="4;9;4" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="675" cy="95" r="7" fill="#00ffcc">
      <animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="810" cy="130" r="6" fill="#00ffcc" />
    <circle cx="810" cy="175" r="6" fill="#00ffcc" />
    <circle cx="810" cy="245" r="6" fill="#00ffcc">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="945" cy="152" r="6" fill="#ffcc00">
      <animate attributeName="r" values="4;8;4" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1075" cy="110" r="6" fill="#ffcc00" />
    <circle cx="1140" cy="110" r="6" fill="#ffcc00">
      <animate attributeName="r" values="4;8;4" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="915" cy="275" r="6" fill="#00ffcc" />
    <circle cx="65" cy="260" r="5" fill="#ff007f">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g font-family="monospace" font-weight="bold">
    <rect x="275" y="218" width="90" height="28" rx="4" fill="#160c31" stroke="#442a78" stroke-width="2" />
    <text x="320" y="237" font-size="14" fill="#b0a8c0" text-anchor="middle">Database</text>
    <rect x="585" y="122" width="95" height="30" rx="4" fill="#160c31" stroke="#00ffcc" stroke-width="2" />
    <text x="632" y="142" font-size="15" fill="#00ffcc" text-anchor="middle">Backend</text>
    <rect x="1040" y="220" width="140" height="44" rx="6" fill="#26164f" stroke="#ffcc00" stroke-width="3" />
    <text x="1110" y="249" font-size="24" fill="#ffcc00" text-anchor="middle" filter="url(#glow)">Frontend</text>
  </g>

  <g font-family="monospace" font-weight="900" class="neon-text">
    <text x="360" y="242" font-size="34" fill="#ff007f">MySQL</text>
    <text x="357" y="239" font-size="34" fill="#00ffcc" filter="url(#glow)">MySQL</text>
    <text x="518" y="177" font-size="40" fill="#ff007f">JS</text>
    <text x="515" y="174" font-size="40" fill="#00ffcc" filter="url(#glow)">JS</text>
    <text x="631" y="201" font-size="42" fill="#ff007f">Node.js</text>
    <text x="628" y="198" font-size="42" fill="#00ffcc" filter="url(#glow)">Node.js</text>
    <text x="778" y="96" font-size="34" fill="#ff007f">CSS</text>
    <text x="775" y="93" font-size="34" fill="#00ffcc" filter="url(#glow)">CSS</text>
    <text x="893" y="205" font-size="34" fill="#ff007f">HTML</text>
    <text x="890" y="202" font-size="34" fill="#ffcc00" filter="url(#glow)">HTML</text>
  </g>

  <rect x="340" y="12" width="520" height="32" fill="#160c31" stroke="#442a78" stroke-width="2" rx="4" />
  <text x="600" y="33" font-family="monospace" font-weight="bold" font-size="15" fill="#00ffcc" text-anchor="middle" letter-spacing="2">
    [ RETRO DEV // FILIPE MATOS SILVA ]<tspan fill="#ff007f">_<animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" /></tspan>
  </text>

  <rect width="1200" height="320" fill="url(#scanlines)" pointer-events="none" />
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="#442a78" stroke-width="4" />
</svg>
